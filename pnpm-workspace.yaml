# Build-script policy for pnpm v11+ (Railway uses pnpm 11 via corepack).
# v11 removed onlyBuiltDependencies/ignoredBuiltDependencies in favor of
# `allowBuilds` (name: true|false). Every dependency with a build script must
# be listed, otherwise a clean/CI install errors with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  "@swc/core": true
  esbuild: true
  sharp: true
  unrs-resolver: true
  "@parcel/watcher": false
  msw: false
