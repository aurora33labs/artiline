services:
  postgres:
    image: postgres:16-alpine
    container_name: artiline-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: artiline
      POSTGRES_PASSWORD: artiline
      POSTGRES_DB: artiline
    ports:
      - "5432:5432"
    volumes:
      - artiline_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artiline -d artiline"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artiline_pg:
