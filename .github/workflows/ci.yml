name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: artiline
          POSTGRES_PASSWORD: artiline
          POSTGRES_DB: artiline
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U artiline -d artiline"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://artiline:artiline@localhost:5432/artiline
      AUTH_SECRET: ci-only-not-secret-32-byte-padding-xxxxxxxx
      AUTH_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm tsc --noEmit

      - name: Lint
        run: pnpm lint

      - name: Drizzle migrate (verify SQL applies)
        run: pnpm db:migrate

      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_ARTILINE_EDITION: oss
