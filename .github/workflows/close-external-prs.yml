name: Close external PRs

# Artiline does not accept external code contributions for now (see
# CONTRIBUTING.md). PRs from non-maintainers are closed with a courteous note.
# Maintainers (owner / org members / collaborators) are unaffected.
#
# Safe by construction: no untrusted input (PR title/body) is interpolated.
# Only author_association (a fixed enum) is read, via github-script in JS.

on:
  pull_request_target:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  close:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const allowed = ["OWNER", "MEMBER", "COLLABORATOR"];
            const assoc = context.payload.pull_request.author_association;
            if (allowed.includes(assoc)) return;

            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body: [
                "Thanks for your interest in Artiline!",
                "",
                "We're not accepting external code contributions right now, so this PR is being closed automatically.",
                "",
                "Bug reports and feature requests are very welcome though, please open an issue. See CONTRIBUTING.md for details.",
              ].join("\n"),
            });

            await github.rest.pulls.update({
              owner,
              repo,
              pull_number: issue_number,
              state: "closed",
            });
